<text x="70" y="126" fill="#bfdbfe" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="600">install once, then ask Codex for parallel resumable workflows</text>
<rect x="70" y="170" width="190" height="58" rx="20" fill="#102033" stroke="#7dd3fc" stroke-width="4"/>

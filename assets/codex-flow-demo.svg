<svg width="1200" height="720" viewBox="0 0 1200 720" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
<title id="title">codex-flow install-first demo</title>
<desc id="desc">Install codex-flow, install the Codex skill, ask Codex for a dynamic workflow, run parallel sub-agents, then resume from the journal.</desc>

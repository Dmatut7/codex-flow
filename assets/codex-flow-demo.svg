<rect x="656" y="189" width="20" height="20" rx="5" transform="rotate(45 666 199)" fill="#fde68a"/>
<text x="691" y="208" fill="#e2e8f0" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="25" font-weight="700">run parallel</text>
<path d="M898 199H944" stroke="#fde68a" stroke-width="5" stroke-linecap="round"/><path d="M944 199l-16-10v20z" fill="#fde68a"/>
<rect x="964" y="170" width="170" height="58" rx="20" fill="#102033" stroke="#c4b5fd" stroke-width="4"/>

<rect x="70" y="290" width="1060" height="395" rx="26" fill="#0b1726" stroke="#1f3a52" stroke-width="3"/>
<rect x="70" y="290" width="1060" height="58" rx="26" fill="#102033"/>
<rect x="70" y="320" width="1060" height="28" fill="#102033"/>
<circle cx="105" cy="319" r="10" fill="#f87171"/><circle cx="139" cy="319" r="10" fill="#fbbf24"/><circle cx="173" cy="319" r="10" fill="#34d399"/>
<text x="220" y="328" fill="#94a3b8" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="26" font-weight="650">Terminal demo</text>
<text x="105" y="392" fill="#7dd3fc" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="650">$ npm install -g codex-flow</text>
<text x="105" y="432" fill="#86efac" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="650">✓ codex-flow installed</text>
<text x="105" y="472" fill="#7dd3fc" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="650">$ codex-flow install-codex</text>
<text x="105" y="512" fill="#86efac" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="650">✓ Installed Codex skill: dynamic-workflow</text>
<text x="105" y="552" fill="#fde68a" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="650">User: use a dynamic workflow to investigate this bug in parallel</text>
<text x="105" y="592" fill="#7dd3fc" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="650">$ codex-flow run login-bug.workflow.ts</text>
<text x="105" y="632" fill="#c4b5fd" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="650">phase investigate: auth.ts · session.ts · api.ts in parallel</text>
<text x="105" y="672" fill="#86efac" font-family="SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="28" font-weight="650">✓ completed nodes replay from .codex-flow/journal/login-bug.jsonl</text>
</svg>
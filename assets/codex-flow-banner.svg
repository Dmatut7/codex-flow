<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">codex-flow banner</title>
  <desc id="desc">Dynamic workflows for Codex: parallel, resumable, journaled sub-agents.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="420" gradientUnits="userSpaceOnUse">
      <stop stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#0b2a3f"/>
      <stop offset="1" stop-color="#132116"/>
    </linearGradient>
    <linearGradient id="accent" x1="150" y1="320" x2="1040" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#a7f3d0"/>
      <stop offset="1" stop-color="#fde68a"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.49 0 0 0 0 0.83 0 0 0 0 0.99 0 0 0 0.45 0"/>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="420" rx="34" fill="url(#bg)"/>
  <g opacity="0.22">
    <circle cx="1040" cy="80" r="190" fill="#7dd3fc"/>
    <circle cx="210" cy="360" r="170" fill="#a7f3d0"/>
  </g>
  <g stroke="url(#accent)" stroke-width="5" stroke-linecap="round" filter="url(#glow)">
    <path d="M210 235 C310 140 430 135 520 215"/>
    <path d="M520 215 C640 315 790 300 900 185"/>
    <path d="M520 215 L520 110"/>
    <path d="M520 215 L520 320"/>
    <path d="M900 185 C955 130 1020 118 1070 142"/>
  </g>
  <g fill="#0b1220" stroke="#d1fae5" stroke-width="4">
    <rect x="150" y="205" width="180" height="70" rx="18" fill="#102033"/>
    <rect x="430" y="75" width="190" height="70" rx="18" fill="#102033"/>
    <rect x="430" y="285" width="190" height="70" rx="18" fill="#102033"/>
    <rect x="820" y="150" width="210" height="70" rx="18" fill="#102033"/>
  </g>
  <g fill="#d1fae5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-weight="700" font-size="24">
    <text x="183" y="248">one request</text>
    <text x="462" y="118">parallel</text>
    <text x="470" y="328">resume</text>
    <text x="852" y="193">journaled</text>
  </g>
  <text x="70" y="92" fill="#f8fafc" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="58" font-weight="800">codex-flow</text>
  <text x="70" y="142" fill="#bfdbfe" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="26" font-weight="600">Dynamic workflows for Codex App and CLI</text>
  <text x="70" y="370" fill="#e2e8f0" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="25" font-weight="600">Turn one natural-language request into parallel, resumable Codex sub-agents.</text>
</svg>
